name: Compile and Lint Backend

# Controls when the workflow will run
on:
  workflow_dispatch:
  pull_request:
    branches: main
  push:
    branches: main

jobs:
  build-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up GnuCOBOL
        uses: fabasoad/setup-cobol-action@v1.6.3
        with:
          version: 3.2

      - name: Linting
        run: |
          cobc -free -I backend/src \
          -fsyntax-only -Wfatal-errors \
          -Wall -Wextra -Wno-terminator \
          backend/src/*.cob

      - name: Compile with warnings
        run: |
          cobc -free -Wfatal-errors \
          -Wall -Wextra -Wno-terminator \
          -I backend/src/ \
          -c backend/src/*.cob
