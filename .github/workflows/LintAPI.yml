name: Lint API

on: [workflow_dispatch, pull_request, push]

jobs:
  lint-api:
    runs-on: ubuntu-latest

    steps:
      - name: Pull repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: cd api && npm install

      - name: Run linting
        run: cd api && npm run lint
