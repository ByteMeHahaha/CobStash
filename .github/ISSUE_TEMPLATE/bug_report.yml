name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: "[Bug]: Name of Bug"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill out the information below as accurately and as detailed as possible.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Briefly describe the issue
      placeholder: The application crashes when...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps needed to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste logs or attach screenshots if applicable
      render: shell

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows system
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project Version
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Can you consistently reproduce the issue?
      options:
        - "Yes"
        - "No"
        - "Sometimes"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before creating this report
          required: true
        - label: I included enough information to reproduce the issue
          required: true
